<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grocery Expiration Tracker - Dashboard</title>
<link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
<div class="nav-links">
<a href="dashboard.html" class="active">Dashboard</a>
<a href="add-item.html">Add Item</a>
<a href="profile.html">Profile</a>
</div>
<button id="logoutBtn">Logout</button>
</nav>
<div class="container">
<h1>Dashboard</h1>
<div id="notificationArea"></div>

<table id="itemsTable">
<thead>
<tr>
<th>Item Name</th>
<th>Purchase Date</th>
<th>Expiration Date</th>
<th>Actions</th>
</tr>
</thead>
<tbody>
<!-- Grocery items will be rendered here -->
</tbody>
</table>

<!-- Email form to manually send expiration alerts -->
<form id="emailForm">
<input type="hidden" name="_subject" value="Grocery Items Expiring Soon!" />
<input type="hidden" name="_template" value="box" />
<textarea name="message" id="messageBox" style="display: none;"></textarea>
<button type="submit">Send Expiration Email</button>
</form>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
